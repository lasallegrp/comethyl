[workspace]
name = "comethyl"
version = "2.0.0"
authors = ["George Eusebio Kuodza <gekuodza@health.ucdavis.edu>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
# linux-aarch64 excluded: longshot has no linux-aarch64 bioconda build.
# Windows not supported natively: use WSL2 (runs as linux-64).

[tasks]
install-comethyl = "Rscript env/install_comethyl.R"
test-r = "Rscript -e 'library(comethyl); library(rtracklayer); library(ReactomePA); sessionInfo()'"

# ============================================================================
# Shared dependencies (all platforms)
# Only CRAN packages from conda-forge — all have ARM64 builds
# System libraries included explicitly to fix linker paths on all platforms
# ALL Bioconductor packages are installed via env/install_comethyl.R
# ============================================================================
[dependencies]
# System libraries — required for correct linker resolution
zlib      = "*"
xz        = "*"
libxml2   = "*"
openssl   = "*"
curl      = "*"
pkg-config = "*"
sqlite    = "*"
pandoc    = "*"
bedtools  = "*"
cairo     = "*"
freetype  = "*"
fontconfig = "*"

# R base — use 4.4.* to match Bioconductor 3.20
r-base = "4.4.*"

# Core CRAN packages (conda-forge, ARM64 builds available)
r-tidyverse   = "*"
r-essentials  = "*"
r-openxlsx    = "*"
r-cowplot     = "*"
r-patchwork   = "*"
r-magrittr    = "*"
r-stringr     = "*"
r-ggplot2     = "*"
r-remotes     = "*"
r-optparse    = "*"
r-enrichr     = "*"
r-ggdendro    = ">=0.2.0,<0.3"
"r-r.devices" = ">=2.17.2,<3"
r-rlist       = ">=0.4.6.2,<0.5"
expat = ">=2.8.1,<3"

# All Bioconductor packages (bsseq, dmrseq, WGCNA, clusterProfiler, etc.)
# are installed via BiocManager in env/install_comethyl.R
# This avoids bioconda ARM64 build gaps and version conflicts

# ============================================================================
# Platform-specific: longshot (bioconda linux-64 and osx-64 only)
# osx-arm64 users: install longshot manually via brew if needed for upstream
# WGBS processing. It is not required for the R analysis workflow itself.
# ============================================================================
[target.linux-64.dependencies]
longshot = "*"

[target.osx-64.dependencies]
longshot = "*"
